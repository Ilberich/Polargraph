name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight deploy
# is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  deploy:
    # A broken build should not reach Pages.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be enabled once by hand, under
      # Settings -> Pages -> Source: GitHub Actions. Until it is, this step
      # fails with "Get Pages site failed / Not Found".
      #
      # enablement: true asks the action to create the site itself. That only
      # works where the token may administer the repository; the default
      # GITHUB_TOKEN may not, and fails with "Resource not accessible by
      # integration". It is kept because it costs nothing and succeeds where
      # permissions allow, but it is not a substitute for the setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is plain static files with no build step, so the source
      # directory is the artifact. The same directory is what gets copied to
      # the plotter's SD card. See AD-1.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
