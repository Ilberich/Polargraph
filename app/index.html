<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polargraph</title>
    <meta
      name="description"
      content="Design tool and machine control for a polargraph wall plotter."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#17191c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 5 L16 21 L28 5' fill='none' stroke='%234db6a4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='24' r='3.5' fill='%234db6a4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__brand">
          <!-- Two belts converging on the gondola. -->
          <svg class="header__mark" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M4 5 L16 21 L28 5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="16" cy="24" r="3.5" fill="currentColor" />
          </svg>
          <h1 class="header__title">Polargraph</h1>
        </div>

        <div class="header__actions">
          <button class="button" type="button" id="import-svg">Import SVG</button>
          <button class="button" type="button" id="import-gcode">Import gcode</button>
          <button class="button button--primary" type="button" id="export-gcode">Export</button>
        </div>

        <div id="mode-badge" class="badge badge--standalone">
          <span class="badge__dot"></span>
          <span id="mode-label">Standalone</span>
        </div>
      </header>

      <main class="main">
        <section class="stage">
          <canvas id="canvas" class="canvas"></canvas>
          <p class="stage__status" id="status"></p>
        </section>

        <aside class="panel" id="panel"></aside>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
