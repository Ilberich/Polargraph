name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight deploy
# is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  deploy:
    # A broken build should not reach Pages.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true provisions Pages via the API on first run, so a
      # fresh clone of this repo deploys without anyone visiting Settings.
      # Without it the job fails with "Get Pages site failed / Not Found"
      # until Pages is switched on by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The app is plain static files with no build step, so the source
      # directory is the artifact. The same directory is what gets copied to
      # the plotter's SD card. See AD-1.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
